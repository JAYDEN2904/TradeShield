openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TradeShield B2B escrow marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone/OTP auth (mocked for MVP)
  - name: users
    description: User profiles and supplier trust stats
  - name: products
    description: Supplier catalog
  - name: orders
    description: Core escrow order lifecycle
  - name: webhooks
    description: Mock payment provider webhooks
  - name: disputes
    description: Dispute raising and admin resolution
  - name: ratings
    description: Post-order ratings
  - name: admin
    description: Admin views across all orders/disputes
  - name: kyc
    description: Identity verification (Ghana Card upload and admin review)
  - name: uploads
    description: File upload endpoints
  - name: notifications
    description: In-app notifications for buyers and suppliers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request an OTP to reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: OTP sent if account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request an OTP code for registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "400":
          description: Invalid phone or account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited — wait before resending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify registration OTP before completing signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResult"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Complete registration for a phone verified via /auth/verify-otp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Phone not verified or already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "204":
          description: Logged out

  /users/me/supplier-dashboard:
    get:
      operationId: getSupplierDashboard
      tags: [users]
      summary: Aggregated supplier dashboard data (auth required, supplier/both role only)
      parameters:
        - name: earningsPeriod
          in: query
          required: false
          schema:
            type: string
            enum: [week, month, all]
            default: month
      responses:
        "200":
          description: Supplier dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDashboard"
        "403":
          description: Forbidden (buyer-only accounts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a public user profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/stats:
    get:
      operationId: getSupplierStats
      tags: [users]
      summary: Trust stats for a supplier (completion rate, total orders, average rating)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Supplier trust stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierStats"

  /users/{id}/ratings:
    get:
      operationId: listUserRatings
      tags: [ratings]
      summary: Ratings received by a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Browse the catalog
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            type: string
          description: Filter by supplier region/town (substring match)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Match product name or supplier business name
        - name: supplierId
          in: query
          required: false
          schema:
            type: integer
          description: When set, returns all listings for that supplier including inactive
      responses:
        "200":
          description: List of catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogProduct"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product listing (supplier only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product listing (owning supplier only)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          description: Not the owning supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Deactivate a product listing (owning supplier only; preserves order history)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          description: Not the owning supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for the current user (as buyer or supplier)
      parameters:
        - name: role
          in: query
          required: false
          description: Filter to orders where the current user is this role
          schema:
            type: string
            enum: [buyer, supplier]
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Buyer creates an order against a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order (pending_supplier_confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order (e.g. below MOQ, insufficient stock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order (buyer, supplier, or admin only)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "403":
          description: Not a party to this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/accept:
    post:
      operationId: acceptOrder
      tags: [orders]
      summary: Supplier accepts the order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order moved to awaiting_payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/reject:
    post:
      operationId: rejectOrder
      tags: [orders]
      summary: Supplier rejects the order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderInput"
      responses:
        "200":
          description: Order moved to expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/pay:
    post:
      operationId: payOrder
      tags: [orders]
      summary: Buyer initiates escrow payment (Moolre Collections charge)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayOrderInput"
      responses:
        "200":
          description: Order moved to payment_processing; webhook/polling resolves to in_escrow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "428":
          description: Moolre requires payer OTP verification before payment can proceed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/ship:
    post:
      operationId: shipOrder
      tags: [orders]
      summary: Supplier marks the order as shipped; starts the 72h auto-release window
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order moved to shipped, auto_release_at set to now + 72h
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/confirm-receipt:
    post:
      operationId: confirmReceipt
      tags: [orders]
      summary: Buyer confirms receipt; initiates disbursement (async — completes via webhook/polling)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReceiptInput"
      responses:
        "200":
          description: Order moved to payout_processing; completed when disbursement webhook confirms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/dispute:
    post:
      operationId: raiseDispute
      tags: [disputes]
      summary: Buyer or supplier raises a dispute on an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "201":
          description: Dispute created; order moved to disputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/request-refund:
    post:
      operationId: requestRefund
      tags: [orders]
      summary: Buyer requests refund after no shipment update (in_escrow, 5+ days since payment)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "201":
          description: Refund request created as dispute; order moved to disputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "409":
          description: Invalid state or too early
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/dispute-reply:
    post:
      operationId: replyToDispute
      tags: [disputes]
      summary: Supplier right-of-reply on an open dispute
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeReplyInput"
      responses:
        "201":
          description: Reply recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeReply"
        "409":
          description: No open dispute or not supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/ratings:
    post:
      operationId: createRating
      tags: [ratings]
      summary: Rate the counterparty of a completed order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Rating recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "409":
          description: Order not completed, or already rated by this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/payments:
    post:
      operationId: handlePaymentWebhook
      tags: [webhooks]
      summary: Mock Moolre Collections webhook — resolves payment_processing to in_escrow (or back to awaiting_payment on failure). Idempotent per moolreReference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookInput"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

  /webhooks/disbursements:
    post:
      operationId: handleDisbursementWebhook
      tags: [webhooks]
      summary: Mock Moolre Bulk Disbursement webhook — resolves payout_processing to completed (or payout_failed). Idempotent per moolreReference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisbursementWebhookInput"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

  /admin/orders:
    get:
      operationId: listAllOrders
      tags: [admin]
      summary: Admin — list all orders, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderDetail"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/disputes:
    get:
      operationId: listDisputes
      tags: [admin]
      summary: Admin — list disputes, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved]
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispute"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [admin]
      summary: Admin — force-resolve a dispute into a target order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeResolutionInput"
      responses:
        "200":
          description: Resolved dispute and updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid target status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: Admin — platform summary metrics
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetrics"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}/release:
    post:
      operationId: adminReleaseOrderFunds
      tags: [admin]
      summary: Admin — manually release escrow funds to supplier
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionInput"
      responses:
        "200":
          description: Payout initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}/refund:
    post:
      operationId: adminRefundOrder
      tags: [admin]
      summary: Admin — refund buyer and close order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionInput"
      responses:
        "200":
          description: Refund initiated, order expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}/retry-payout:
    post:
      operationId: adminRetryPayout
      tags: [admin]
      summary: Admin — retry a failed disbursement
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionInput"
      responses:
        "200":
          description: Payout retry initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/{id}/expire:
    post:
      operationId: adminExpireOrder
      tags: [admin]
      summary: Admin — manually expire a stuck order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionInput"
      responses:
        "200":
          description: Order expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/kyc-document:
    post:
      operationId: uploadKycDocument
      tags: [uploads]
      summary: Upload a KYC document (Ghana Card front or back)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadKycDocumentResponse"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/product-image:
    post:
      operationId: uploadProductImage
      tags: [uploads]
      summary: Upload a product photo (JPEG, PNG, or WebP)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadProductImageResponse"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kyc/submit:
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit Ghana Card details for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitInput"
      responses:
        "200":
          description: Submission received, now pending admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmitResponse"
        "400":
          description: Validation error or already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kyc/status:
    get:
      operationId: getKycStatus
      tags: [kyc]
      summary: Get current user's KYC status
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/kyc/users:
    get:
      operationId: getAdminKycUsers
      tags: [kyc]
      summary: List all users with KYC information (admin only)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/KycStatus"
          description: Filter by KYC status
      responses:
        "200":
          description: All users with KYC records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminKycUserItem"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/kyc/queue:
    get:
      operationId: getAdminKycQueue
      tags: [kyc]
      summary: List all pending KYC submissions (admin only)
      responses:
        "200":
          description: Pending KYC queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminKycQueueItem"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/kyc/{userId}/approve:
    patch:
      operationId: approveKyc
      tags: [kyc]
      summary: Approve a KYC submission (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User KYC approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/kyc/{userId}/reject:
    patch:
      operationId: rejectKyc
      tags: [kyc]
      summary: Reject a KYC submission (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycRejectInput"
      responses:
        "200":
          description: User KYC rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent in-app notifications (last 30 days)
      responses:
        "200":
          description: Notifications for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Unread notification count for the badge
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code (e.g. OTP_REQUIRED)

    UserRole:
      type: string
      enum: [buyer, supplier, both]

    User:
      type: object
      required:
        [id, phone, role, businessName, location, isAdmin, kycStatus, createdAt]
      properties:
        id:
          type: integer
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        businessName:
          type: string
        location:
          type: string
        category:
          type: ["string", "null"]
        payoutMomoNumber:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        kycStatus:
          $ref: "#/components/schemas/KycStatus"
        ghanaCardNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        businessName:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        category:
          type: string
        payoutMomoNumber:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    SupplierStats:
      type: object
      required:
        [
          totalOrders,
          completedOrders,
          completionRate,
          averageRating,
          isNewSupplier,
          hasTransactionHistory,
        ]
      properties:
        totalOrders:
          type: integer
        completedOrders:
          type: integer
        completionRate:
          type: ["number", "null"]
          description: Share of terminal orders that completed; null when no terminal history
        averageRating:
          type: ["number", "null"]
        isNewSupplier:
          type: boolean
          description: True when fewer than 5 completed orders
        hasTransactionHistory:
          type: boolean
          description: False when supplier has zero completed terminal trades

    OtpRequestInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 9
          description: Ghana mobile number (+233 or local 0… format)

    OtpRequestResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        debugCode:
          type: string
        retryAfterSeconds:
          type: integer
          description: Seconds until another OTP can be requested

    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          minLength: 9
        password:
          type: string
          minLength: 8

    ForgotPasswordInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 9

    ResetPasswordInput:
      type: object
      required: [phone, code, password]
      properties:
        phone:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
        password:
          type: string
          minLength: 8

    OtpVerifyInput:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string

    OtpVerifyResult:
      type: object
      required: [verified, needsRegistration]
      properties:
        verified:
          type: boolean
        needsRegistration:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"

    RegisterInput:
      type: object
      required: [phone, password, businessName, location, role]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 8
        businessName:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/UserRole"
        category:
          type: string
        payoutMomoNumber:
          type: string

    Product:
      type: object
      required:
        [
          id,
          supplierId,
          name,
          category,
          unitPrice,
          moq,
          unit,
          stockQty,
          isActive,
          createdAt,
        ]
      properties:
        id:
          type: integer
        supplierId:
          type: integer
        name:
          type: string
        category:
          type: string
        unitPrice:
          type: string
        moq:
          type: integer
        unit:
          type: string
        stockQty:
          type: integer
        photoUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CatalogProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required:
            [supplierBusinessName, supplierLocation, supplierCompletedOrders, supplierIsNew]
          properties:
            supplierBusinessName:
              type: string
            supplierLocation:
              type: string
            supplierCompletedOrders:
              type: integer
            supplierAverageRating:
              type: ["number", "null"]
            supplierIsNew:
              type: boolean

    ProductInput:
      type: object
      required: [name, category, unitPrice, unit, stockQty]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        unitPrice:
          type: string
        moq:
          type: integer
          minimum: 1
        unit:
          type: string
          minLength: 1
        stockQty:
          type: integer
          minimum: 0
        photoUrl:
          type: string
        isActive:
          type: boolean

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        unitPrice:
          type: string
        moq:
          type: integer
          minimum: 1
        unit:
          type: string
          minLength: 1
        stockQty:
          type: integer
          minimum: 0
        photoUrl:
          type: string
        isActive:
          type: boolean

    OrderStatus:
      type: string
      enum:
        - pending_supplier_confirmation
        - awaiting_payment
        - payment_processing
        - in_escrow
        - shipped
        - payout_processing
        - completed
        - disputed
        - post_release_disputed
        - expired
        - rejected
        - payout_failed

    Order:
      type: object
      required:
        [
          id,
          buyerId,
          supplierId,
          productId,
          quantity,
          totalAmount,
          platformFee,
          status,
          createdAt,
        ]
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        supplierId:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
        totalAmount:
          type: string
        platformFee:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
        shippedAt:
          type: ["string", "null"]
          format: date-time
        autoReleaseAt:
          type: ["string", "null"]
          format: date-time
        deliveryLocation:
          type: ["string", "null"]
        preferredDeliveryDate:
          type: ["string", "null"]
          format: date-time
        rejectReason:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        autoReleaseReminderSent:
          type: boolean
        confirmPhotoUrl:
          type: ["string", "null"]
        productName:
          type: string
          description: Product display name (included when listing orders)

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            product:
              $ref: "#/components/schemas/Product"
            buyer:
              $ref: "#/components/schemas/User"
            supplier:
              $ref: "#/components/schemas/User"
            disputes:
              type: array
              items:
                $ref: "#/components/schemas/Dispute"

    OrderInput:
      type: object
      required: [productId, quantity, deliveryLocation, preferredDeliveryDate]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        deliveryLocation:
          type: string
          minLength: 1
        preferredDeliveryDate:
          type: string
          format: date

    RejectOrderInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1

    MomoProvider:
      type: string
      enum: [mtn, telecel, airteltigo]
      description: Mobile money network for the escrow collection

    PayOrderInput:
      type: object
      properties:
        momoProvider:
          $ref: "#/components/schemas/MomoProvider"
          description: Required on the first pay attempt (not needed when only submitting otpCode if already stored)
        momoNumber:
          type: string
          description: MoMo wallet to charge (Ghana local or +233). Required on first pay attempt.
        otpCode:
          type: string
          description: SMS verification OTP when Moolre returns TP14

    AdminMetrics:
      type: object
      required:
        [
          totalVolumeGhs,
          totalPlatformFeesGhs,
          activeBuyers,
          activeSuppliers,
          totalOrders,
          completedOrders,
          completionRate,
          openDisputes,
        ]
      properties:
        totalVolumeGhs:
          type: string
        totalPlatformFeesGhs:
          type: string
        activeBuyers:
          type: integer
        activeSuppliers:
          type: integer
        totalOrders:
          type: integer
        completedOrders:
          type: integer
        completionRate:
          type: number
        openDisputes:
          type: integer

    AdminActionInput:
      type: object
      properties:
        notes:
          type: string

    DisputeStatus:
      type: string
      enum: [open, resolved]

    Dispute:
      type: object
      required: [id, orderId, raisedBy, reason, status, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        raisedBy:
          type: integer
        reason:
          type: string
        status:
          $ref: "#/components/schemas/DisputeStatus"
        category:
          oneOf:
            - $ref: "#/components/schemas/DisputeCategory"
            - type: "null"
        evidenceUrls:
          type: ["array", "null"]
          items:
            type: string
        resolution:
          type: ["string", "null"]
        resolvedByAdminId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    DisputeCategory:
      type: string
      enum: [quality, non_delivery, quantity, other]

    DisputeInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/DisputeCategory"
        evidenceUrls:
          type: array
          items:
            type: string

    DisputeReplyInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    DisputeReply:
      type: object
      required: [id, disputeId, authorId, message, createdAt]
      properties:
        id:
          type: integer
        disputeId:
          type: integer
        authorId:
          type: integer
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    DisputeResolutionInput:
      type: object
      required: [targetStatus, resolution]
      properties:
        targetStatus:
          $ref: "#/components/schemas/OrderStatus"
        resolution:
          type: string
          minLength: 1
        buyerAmount:
          type: string
          description: Optional GHS amount to refund to buyer (partial split)
        supplierAmount:
          type: string
          description: Optional GHS amount to release to supplier (partial split)

    Rating:
      type: object
      required: [id, orderId, raterId, rateeId, stars, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        raterId:
          type: integer
        rateeId:
          type: integer
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RatingInput:
      type: object
      required: [stars]
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    PaymentWebhookInput:
      type: object
      required: [moolreReference, status]
      properties:
        orderId:
          type: integer
        moolreReference:
          type: string
        status:
          type: string
          enum: [succeeded, failed]

    DisbursementWebhookInput:
      type: object
      required: [moolreReference, status]
      properties:
        orderId:
          type: integer
        moolreReference:
          type: string
        status:
          type: string
          enum: [succeeded, failed]

    ConfirmReceiptInput:
      type: object
      properties:
        photoUrl:
          type: string
          description: Optional photo URL attached at receipt confirmation

    EarningsPeriod:
      type: string
      enum: [week, month, all]

    SupplierDashboardEarnings:
      type: object
      required: [period, earnedGhs, inEscrowGhs, pendingReleaseGhs]
      properties:
        period:
          $ref: "#/components/schemas/EarningsPeriod"
        earnedGhs:
          type: string
          description: Net payout (totalAmount - platformFee) for completed orders in the selected period
        inEscrowGhs:
          type: string
          description: Sum of totalAmount for in_escrow and shipped orders (funds are secured)
        pendingReleaseGhs:
          type: string
          description: Sum of totalAmount for payout_processing orders

    SupplierDashboardCatalog:
      type: object
      required: [activeCount, inactiveCount, outOfStockCount, lowStockCount]
      properties:
        activeCount:
          type: integer
        inactiveCount:
          type: integer
        outOfStockCount:
          type: integer
          description: Active products with stockQty === 0
        lowStockCount:
          type: integer
          description: Active products where 0 < stockQty < moq

    SupplierDashboardOnboarding:
      type: object
      required: [hasProducts, hasCompletedOrder]
      properties:
        hasProducts:
          type: boolean
        hasCompletedOrder:
          type: boolean

    SupplierDashboard:
      type: object
      required: [earnings, needsAction, recentOrders, catalog, trust, onboarding]
      properties:
        earnings:
          $ref: "#/components/schemas/SupplierDashboardEarnings"
        needsAction:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetail"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetail"
        catalog:
          $ref: "#/components/schemas/SupplierDashboardCatalog"
        trust:
          $ref: "#/components/schemas/SupplierStats"
        onboarding:
          $ref: "#/components/schemas/SupplierDashboardOnboarding"

    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    KycStatus:
      type: string
      enum: [none, pending, approved, rejected]

    KycDocType:
      type: string
      enum: [ghana_card_front, ghana_card_back]

    KycDocument:
      type: object
      required: [docType, storageUrl]
      properties:
        docType:
          $ref: "#/components/schemas/KycDocType"
        storageUrl:
          type: string

    KycSubmitInput:
      type: object
      required: [ghanaCardNumber, docUrls]
      properties:
        ghanaCardNumber:
          type: string
          description: Ghana Card number in format GHA-XXXXXXXXX-X
        docUrls:
          type: object
          required: [ghana_card_front, ghana_card_back]
          properties:
            ghana_card_front:
              type: string
              format: uri
            ghana_card_back:
              type: string
              format: uri

    KycSubmitResponse:
      type: object
      required: [submitted]
      properties:
        submitted:
          type: boolean

    KycStatusResponse:
      type: object
      required: [kycStatus]
      properties:
        kycStatus:
          $ref: "#/components/schemas/KycStatus"
        kycRejectionReason:
          type: ["string", "null"]
        ghanaCardNumber:
          type: ["string", "null"]

    KycRejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    AdminKycQueueItem:
      type: object
      required: [id, phone, businessName, role, kycSubmittedAt, documents]
